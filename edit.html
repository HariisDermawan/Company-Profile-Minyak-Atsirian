<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- NAVBAR -->
  <header
    class="fixed top-0 left-0 w-full bg-white shadow-md rounded-b-2xl h-20 px-6 md:px-8 flex justify-between items-center z-50">
    <div class="flex items-center gap-4">
      <button id="toggleSidebar" class="md:hidden focus:outline-none">
        <svg id="iconHamburger" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-800" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg id="iconClose" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-800 hidden" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <div class="text-xl font-bold">Logo</div>
    </div>
    <div class="text-sm font-semibold">Admin</div>
  </header>

  <!-- SIDEBAR -->
  <aside id="sidebar"
    class="fixed top-20 left-0 w-60 h-[calc(100vh-5rem)] bg-white px-6 py-10 flex flex-col items-start transition-transform duration-300 transform -translate-x-full md:translate-x-0 md:block z-40 shadow-md">
    <div class="w-24 h-24 bg-gray-300 rounded-full mx-auto mb-10"></div>
    <nav class="flex flex-col space-y-4 w-full text-sm font-medium">
      <a href="#" class="px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-[#F38D22] transition">Dashboard</a>
      <a href="#" class="px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-[#F38D22] transition">Gallery</a>
      <a href="#" class="px-3 py-2 rounded-lg hover:bg-gray-100 hover:text-[#F38D22] transition">Logout</a>
    </nav>
  </aside>

  <main class="pt-24 pb-10 px-4 md:px-6 ml-0 md:ml-60">
    <section class="bg-white shadow-md rounded-xl p-6 w-full">
      <h2 class="text-lg font-bold text-center mb-6">Edit Data Minyak Atsiri</h2>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Form -->
        <form class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">

          <!-- Upload Gambar -->
          <div class="md:col-span-2">
            <label class="block text-sm text-gray-700 mb-1">Upload Gambar</label>
            <input type="file" id="gambarInput" accept="image/*" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm 
                   file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 
                   file:bg-[#F38D22] file:text-white hover:file:bg-[#d97b1b] transition" />
          </div>

          <!-- Jenis Minyak -->
          <div>
            <label class="block text-sm text-gray-700 mb-1">Jenis Minyak</label>
            <input type="text" placeholder="Contoh: Cengkeh / Nilam" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm 
                   focus:outline-none focus:ring-2 focus:ring-[#F38D22]" />
          </div>

          <!-- Jumlah -->
          <div>
            <label class="block text-sm text-gray-700 mb-1">Jumlah (ml)</label>
            <input type="number" placeholder="Contoh: 250" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm 
                   focus:outline-none focus:ring-2 focus:ring-[#F38D22]" />
          </div>

          <!-- Deskripsi -->
          <div class="md:col-span-2">
            <label class="block text-sm text-gray-700 mb-1">Deskripsi</label>
            <textarea placeholder="Keterangan tambahan..." class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm 
                   focus:outline-none focus:ring-2 focus:ring-[#F38D22]" rows="4"></textarea>
          </div>

          <!-- Tombol -->
          <div class="md:col-span-2 flex justify-start gap-3 mt-2">
            <button type="submit" class="bg-[#F38D22] text-white px-6 py-2 rounded-lg text-sm 
           hover:bg-[#d97b1b] transition">
              Simpan
            </button>
            <button type="button" class="bg-gray-300 text-gray-800 px-6 py-2 rounded-lg text-sm 
           hover:bg-gray-400 transition">
              Batal
            </button>
          </div>
        </form>
        <div
          class="bg-gray-50 border border-dashed border-gray-300 rounded-xl p-4 flex items-center justify-center min-h-[240px]">
          <div id="previewContainer" class="w-full h-full">
            <img id="previewImg" src="#" alt="Preview Gambar" class="w-full h-full object-cover rounded-lg hidden" />
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const gambarInput = document.getElementById('gambarInput');
    const previewImg = document.getElementById('previewImg');

    gambarInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        previewImg.classList.remove('hidden');

        reader.onload = function (e) {
          previewImg.src = e.target.result;
        };

        reader.readAsDataURL(file);
      } else {
        previewImg.classList.add('hidden');
        previewImg.src = "#";
      }
    });

    const toggleBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    const iconHamburger = document.getElementById('iconHamburger');
    const iconClose = document.getElementById('iconClose');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
      iconHamburger.classList.toggle('hidden');
      iconClose.classList.toggle('hidden');
    });
  </script>

</body>

</html>
