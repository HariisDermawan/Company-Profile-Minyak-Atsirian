<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Finnger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body class="bg-white">

  <div class="min-h-screen flex flex-col md:flex-row">

    <!-- Ilustrasi -->
    <div class="flex justify-center items-center md:w-1/2 w-full bg-gradient-to-tr from-[#f9f9f9] to-[#edf0c6] py-8 px-6 md:py-0 md:px-10">
      <img src="logo/LOGO ATSIRI IN-7.png" alt="Login Illustration"
           class="w-full max-w-[250px] sm:max-w-[300px] md:max-w-[400px] object-contain drop-shadow-2xl">
    </div>

    <!-- Form Login -->
    <div class="flex flex-col justify-center items-center md:items-start md:w-1/2 w-full px-6 sm:px-10 md:px-20 py-10 md:py-16">
      <div class="w-full max-w-md">
        <h1 class="text-3xl sm:text-4xl md:text-4xl font-extrabold text-gray-900 leading-tight">
          <span style="color: #AEB738">Admin Atsirian</span>
        </h1>
        <p class="text-gray-500 mt-2 sm:mt-3 mb-6 sm:mb-8 text-sm sm:text-base">Hey, welcome back to your special place</p>

        <form class="space-y-4 sm:space-y-6 relative">
          <input type="email" placeholder="Enter your email"
                 class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#AEB738] focus:outline-none placeholder-gray-400" />

          <div class="relative">
            <input type="password" id="password" placeholder="••••••••••"
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#AEB738] focus:outline-none placeholder-gray-400" />
            <button type="button" id="togglePassword"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm hover:text-gray-700">
              Show
            </button>
          </div>

          <div class="flex items-center justify-between text-sm text-gray-600">
            <label class="flex items-center">
              <input type="checkbox" class="form-checkbox accent-[#AEB738]" />
              <span class="ml-2">Remember me</span>
            </label>
          </div>

          <button
            class="w-full bg-[#AEB738] hover:bg-[#96a22f] transition text-white font-medium py-3 rounded-xl shadow-md">
            Sign In
          </button>
        </form>
      </div>
    </div>

  </div>

  <script>
    // Toggle show/hide password
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');

    toggleBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = 'Hide';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = 'Show';
      }
    });
  </script>

</body>
</html>
